<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><meta name="description" content="免費將網址轉成 QR Code，直接下載圖片分享。">
<title>Link to QR Code｜網址轉 QR Code</title>
<style>
:root{--ink:#173936;--green:#1c6555;--muted:#657875;--paper:#f5f4ef;--mint:#dceee5;--coral:#f4a07b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.page{max-width:1050px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:70px}.brand{font-weight:750}.privacy{font-size:12px;color:var(--muted)}main{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}small{color:var(--green);letter-spacing:.16em;font-weight:700}h1{font-size:clamp(42px,6vw,68px);line-height:1.08;letter-spacing:-.05em;margin:18px 0}h1 span{color:var(--green)}.intro{color:var(--muted);line-height:1.8;margin-bottom:32px}label{display:block;font-weight:700;font-size:14px;margin-bottom:10px}input{width:100%;height:56px;border:1px solid #d5ded8;border-radius:14px;padding:0 16px;font-size:16px;background:white;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 4px #1c65551a}button{font:inherit;cursor:pointer}.generate{width:100%;height:54px;margin-top:12px;border:0;border-radius:14px;background:var(--green);color:white;font-weight:700}.error{min-height:24px;color:#bd5138;font-size:13px;margin-top:6px}.hint{font-size:12px;color:#84938d;line-height:1.6}.visual{position:relative;min-height:420px;display:grid;place-items:center}.orb{position:absolute;width:min(390px,90%);aspect-ratio:1;background:var(--mint);border-radius:50%}.card{z-index:1;background:#fffefa;border-radius:26px;padding:28px;width:min(330px,90%);min-height:360px;text-align:center;box-shadow:0 24px 70px #153d3215;display:flex;align-items:center;justify-content:center;flex-direction:column}.qr{width:236px;height:236px;border:1px solid #edf1ed;border-radius:15px;display:grid;place-items:center;background:white;margin:0 auto 18px}.qr canvas,.qr img{max-width:210px;max-height:210px}.caption{font-weight:700;margin:0 0 6px}.sub{font-size:12px;color:#85938d;overflow-wrap:anywhere;margin:0}.actions{display:none;gap:8px;width:100%;margin-top:16px}.actions.show{display:flex}.actions button{flex:1;border:1px solid #dce5df;border-radius:10px;background:white;padding:10px;color:var(--ink);font-size:13px;font-weight:700}.actions .primary{background:var(--ink);color:white}footer{border-top:1px solid #dce5df;margin-top:60px;padding-top:18px;display:flex;justify-content:space-between;color:#83918b;font-size:12px}@media(max-width:720px){header{margin-bottom:45px}main{grid-template-columns:1fr;gap:8px}.intro{margin-bottom:24px}.visual{min-height:380px}footer{margin-top:32px;gap:10px;flex-wrap:wrap}}
</style>
</head>
<body><div class="page">
<header><div class="brand">⌁　Link to QR</div><div class="privacy">◈ 本機生成・網址不會上傳</div></header>
<main><section><small>URL → QR CODE</small><h1>一條連結，<br><span>一掃即到。</span></h1><p class="intro">貼上網址，幾秒就能生成清晰 QR Code。下載圖片，放到海報、名片或訊息裡分享。</p>
<form id="form" novalidate><label for="url">輸入你想分享的網址</label><input id="url" type="url" inputmode="url" autocomplete="url" placeholder="例如：www.example.com" maxlength="2048"><div class="error" id="error" aria-live="polite"></div><button class="generate" type="submit">生成 QR Code　→</button><p class="hint">支援 http:// 或 https:// 網址；未輸入協定時會自動補上 https://。</p></form></section>
<section class="visual" aria-label="QR Code 預覽"><div class="orb" aria-hidden="true"></div><div class="card"><div class="qr" id="qr"><span style="color:#9aa8a2;font-size:13px">QR Code 預覽</span></div><p class="caption" id="caption">你的 QR Code 會出現在這裡</p><p class="sub" id="sub">輸入網址，按下生成開始使用</p><div class="actions" id="actions"><button class="primary" id="download" type="button">下載 PNG</button><button id="copy" type="button">複製網址</button></div></div></section></main>
<footer><span>免費使用 · 無需註冊</span><span>你的連結只在這部裝置上處理</span></footer></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{const form=document.getElementById('form'),input=document.getElementById('url'),error=document.getElementById('error'),box=document.getElementById('qr'),actions=document.getElementById('actions');let current='';function normalize(raw){let s=raw.trim();if(!s)return null;if(!/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(s))s='https://'+s;try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)&&u.hostname?u.href:null}catch{return null}}form.addEventListener('submit',e=>{e.preventDefault();error.textContent='';const url=normalize(input.value);if(!url){error.textContent='請輸入有效的 http 或 https 網址。';input.focus();return}if(!window.QRCode){error.textContent='QR Code 程式載入失敗，請重新整理頁面再試。';return}current=url;box.replaceChildren();new QRCode(box,{text:url,width:210,height:210,colorDark:'#173936',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});document.getElementById('caption').textContent='掃描 QR Code 即可前往';document.getElementById('sub').textContent=url;actions.classList.add('show')});document.getElementById('download').addEventListener('click',()=>{const canvas=box.querySelector('canvas'),img=box.querySelector('img'),url=canvas?canvas.toDataURL('image/png'):img?.src;if(!url)return;const a=document.createElement('a');a.href=url;a.download='link-qr-code.png';a.click()});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current);document.getElementById('copy').textContent='已複製！';setTimeout(()=>document.getElementById('copy').textContent='複製網址',1500)}catch{error.textContent='複製失敗，請手動選取網址。'}})})();
</script></body></html>
